    source_path: ''
    local_path: _LIBRARY/tactic-reasons-canvas-review.md
  - id: TACTIC:refactoring-change-function-declaration
    kind: tactic
    title: 'Refactoring: Change Function Declaration'
    summary: "Rename a function, adjust its parameters, or change its signature to better reflect its current responsibility. Good names reduce cognitive load; good parameter lists reduce coupling. Also known as Rename Function, Add Parameter, Remove Parameter, Change Signature.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-change-function-declaration.md
  - id: TACTIC:refactoring-combine-functions-into-transform
    kind: tactic
    title: 'Refactoring: Combine Functions into Transform'
    summary: "Consolidate multiple functions that independently calculate derived values from the same input record into a single transform function that returns an enriched copy. Eliminates scattered derivation logic and makes the full set of computed properties discoverable in one place.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-combine-functions-into-transform.md
  - id: TACTIC:refactoring-conditional-to-strategy
    kind: tactic
    title: Refactoring Conditional to Strategy
    summary: Replace algorithm-selection conditionals with strategy implementations behind a stable interface.
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-conditional-to-strategy.md
  - id: TACTIC:refactoring-consolidate-conditional-expression
    kind: tactic
    title: 'Refactoring: Consolidate Conditional Expression'
    summary: "Merge multiple sequential conditional checks that produce the same result into a single combined condition, then extract it into a named predicate function. Replaces mechanical guard sequences with a self-documenting intent declaration.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-consolidate-conditional-expression.md
  - id: TACTIC:refactoring-encapsulate-record
    kind: tactic
    title: 'Refactoring: Encapsulate Record'
    summary: "Replace a raw data record (dict, plain object, named tuple used mutably) with a class that controls access through getters and setters. Encapsulation lets you add validation, rename fields, and change internal representation without rippling through every consumer. Also known as Replace Record with Data Class.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-encapsulate-record.md
  - id: TACTIC:refactoring-encapsulate-variable
    kind: tactic
    title: 'Refactoring: Encapsulate Variable'
    summary: "Wrap a widely-accessed module-level or global variable behind getter and setter functions. This creates a single chokepoint for monitoring access, adding validation, and later changing the variable's type or structure without updating every consumer. Also known as Encapsulate Field, Self-Encapsulate Field.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-encapsulate-variable.md
  - id: TACTIC:refactoring-extract-class-by-responsibility-split
    kind: tactic
    title: Refactoring Extract Class by Responsibility Split
    summary: Split a class with mixed concerns into focused classes aligned to cohesive responsibilities.
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-extract-class-by-responsibility-split.md
  - id: TACTIC:refactoring-extract-first-order-concept
    kind: tactic
    title: Refactoring Extract First-Order Concept
    summary: Turn implicit or duplicated logic into an explicit concept with a clear responsibility and name.
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-extract-first-order-concept.md
  - id: TACTIC:refactoring-guard-clauses-before-polymorphism
    kind: tactic
    title: Refactoring Guard Clauses Before Polymorphism
    summary: Flatten nested branch pyramids into ordered guard clauses before extracting polymorphic behavior.
    source_path: ''
    local_path: _LIBRARY/tactic-refactoring-guard-clauses-before-polymorphism.md
  - id: TACTIC:refactoring-inline-temp
    kind: tactic
